include:
  - project: ci/core-cicd
    ref: main
    file: nexcel.gitlab-ci.yml

.e2e-test:
  stage: post-deploy
  image:
    name: grafana/k6:latest
    entrypoint: ['']
  before_script: []
  after_script: []
  resource_group: "e2t-test"
  rules:
    - if: '$ENV_NAME != "LOCAL"'
      when: never
    - !reference [.cd_rules, deploy_k8s]
    - !reference [.cd_rules, deploy]
  artifacts:
    reports:
      load_performance: summary.json
    paths:
      - summary.html
    when: always

e2e-smoke-test:
  extends: .e2e-test
  script: ["k6 run --summary-export=summary.json LoadTests/smoke.js"] 
  
e2e-constant-arrived-test:
  extends: .e2e-test
  needs: ['e2e-smoke-test']
  script: ['k6 run -e RUN_MODE=CONSTANT_RATE --summary-export=summary.json LoadTests/script.js']


