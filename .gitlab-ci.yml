include:
  - project: ci/core-cicd
    ref: main
    file: nexcel.gitlab-ci.yml

.performance:
  stage: post-deploy
  image:
    name: grafana/k6:latest
    entrypoint: ['']
  before_script: ['']
  after_script: []
  resource_group: "e2t-test"
  rules:
    - if: '$ENV_NAME != "LOCAL"'
      when: never
    - !reference [.cd_rules, deploy_k8s]
    - !reference [.cd_rules, deploy]

performance-smoke-test:
  extends: .performance
  script: ["k6 run LoadTests/smoke.js"] 
  
performance-constant-arrived-test:
  extends: .performance
  needs: ['performance-smoke-test']
  script: ["k6 run -e RUN_MODE=CONSTANT_RATE --summary-export=summary.json LoadTests/script.js"] 
  artifacts:
    reports:
      load_performance: summary.json
    when: always

# Manual Trigger
performance-ramping-test:
  stage: ".post"
  extends: .performance
  script: ["k6 run -e RUN_MODE=CONSTANT_RATE LoadTests/script.js"] 
  rules:
    - if: '$ENV_NAME == "LOCAL"'
      when: manual
    - if: '$ENV_NAME != "LOCAL"'
      when: never
    - !reference [.cd_success_rules]
  artifacts:
    paths:
      - summary.html
    when: always

