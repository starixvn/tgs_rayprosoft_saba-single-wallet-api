include:
  - project: ci/core-cicd
    ref: main
    file: nexcel.gitlab-ci.yml

.performance:
  stage: post-deploy
  image:
    name: grafana/k6:latest
    entrypoint: ['']
  before_script: ['']
  after_script: []
  resource_group: "e2t-test"
  rules:
    - if: $ENV_NAME != "LOCAL"
      when: never
    - !reference [.cd_rules, deploy_k8s]
    - !reference [.cd_rules, deploy]


performance-smoke-test:
  extends: .performance
  script: ["k6 run --summary-export=summary.json LoadTests/smoke.js"] 
  artifacts:
    paths:
      - summary.html
    when: always

performance-constant-arrived-test:
  extends: .performance
  needs: ['performance-smoke-test']
  script: ["k6 run --summary-export=summary.json LoadTests/smoke.js"] 
  artifacts:
    paths:
      - summary.html
    when: always

performance-ramping-test:
  stage: ".post"
  image:
    name: grafana/k6:latest
    entrypoint: ['']
  before_script: ['']
  after_script: []
  script: ["k6 run --summary-export=summary.json LoadTests/smoke.js"] 
  when: manual
  rules:
    - !reference [.cd_rules, cleanup]
  artifacts:
    paths:
      - summary.html
    when: always
    
performance-constant-arrived-merged-test:
  extends: .performance
  stage: test
  script: ["k6 run --summary-export=summary.json LoadTests/smoke.js"] 
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  artifacts:
    reports:
      load_performance: summary.json
    when: always

